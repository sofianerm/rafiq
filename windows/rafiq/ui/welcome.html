<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bienvenue dans Rafiq</title>
<style>
  /* L'accueil du premier lancement : Rafiq se présente et pose ses questions, un écran à la fois, au
     style du notch (noir, vert #00FF88, Segoe UI). Tout part dans config.json par set_setup et
     set_notch_modules, et seulement à la fin (« C'est parti ») : fermer avant ne change rien. */
  :root{--green:#00FF88;--yellow:#F2FF00;--text:#e8e8ea;--text2:#9a9aa0;--text3:#5a5a60;--line:#222226;--field:#141416}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--text);overflow:hidden;user-select:none;
    font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}

  #bar{height:38px;display:flex;justify-content:flex-end;align-items:center}
  #close{width:44px;height:34px;border:0;background:transparent;color:var(--text3);font-size:15px}
  #close:hover{color:var(--text);background:#1a1a1d}

  /* Rafiq : l'anneau du notch, qui respire */
  #me{display:flex;align-items:center;gap:12px;padding:0 48px;margin-top:4px}
  #ring{width:46px;height:46px;flex:none;position:relative}
  #ring svg{width:46px;height:46px;transform:rotate(-90deg)}
  #ring .bg{stroke:#1d1d20}
  #ring .fg{stroke:var(--green);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
  #ring span{position:absolute;inset:0;display:grid;place-items:center;font:600 18px "Segoe UI";color:var(--green)}
  #ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 22px rgba(0,255,136,.18);animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35}}
  #me .who{font-size:12px;color:var(--text2)}
  #me .who b{color:var(--text);font-weight:600}

  #stage{position:relative;height:calc(100% - 38px - 50px - 78px)}
  .screen{position:absolute;inset:0;padding:18px 48px 0;overflow-y:auto;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .screen.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
  .screen.leave{animation:leave .25s ease-in both;pointer-events:none}
  @keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes leave{to{opacity:0;transform:translateX(-28px)}}
  .screen > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .screen > *:nth-child(2){animation-delay:.08s}
  .screen > *:nth-child(3){animation-delay:.16s}
  .screen > *:nth-child(4){animation-delay:.24s}
  .screen > *:nth-child(5){animation-delay:.32s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h1{font-size:26px;font-weight:600;letter-spacing:-.3px;margin:0 0 10px;line-height:1.2}
  h1 em{font-style:normal;color:var(--green)}
  p{margin:0 0 14px;color:var(--text2)}
  .feats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:6px 0 4px;font-size:13px}
  .feats div{display:flex;gap:8px;align-items:baseline}
  .feats i{font-style:normal;color:var(--green);width:14px;text-align:center;flex:none}

  input,select{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);
    border-radius:10px;padding:11px 14px;width:100%;outline:none;user-select:text}
  input:focus,select:focus{border-color:var(--green)}
  select{font-size:14px;padding:9px 12px}
  select option{background:#111}
  .sugg{margin-top:6px}
  .sugg button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 12px}
  .sugg button:hover{background:#151518}
  .sugg small,.chosen small{color:var(--text2);margin-left:6px}
  .note{font-size:12px;color:var(--text3);margin-top:10px}
  .note .lk{color:var(--text2);text-decoration:underline;cursor:pointer}
  .chosen{margin-top:12px;font-size:14px}
  .chosen b{color:var(--green);font-weight:600}

  .mini{flex:none;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 16px;font-size:14px}
  .mini:hover{border-color:var(--green);color:var(--green)}
  .yesno{display:flex;gap:10px;margin:4px 0 16px}
  .yesno button{flex:1;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:13px;font-size:15px}
  .yesno button:hover{border-color:#3a3a40}
  .yesno button.on{border-color:var(--green);color:var(--green)}

  .stops .row{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
  .stops .row button{border:0;background:transparent;color:var(--text3);padding:2px 6px}
  .stops .row button:hover{color:var(--text)}

  .mods{display:grid;gap:8px}
  .mod{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 14px}
  .mod:hover{border-color:#3a3a40}
  .mod .t{flex:1}
  .mod .t b{display:block;font-weight:600;font-size:14px}
  .mod .t span{font-size:12px;color:var(--text2)}
  .mod .ck{width:20px;height:20px;border-radius:10px;border:1.5px solid #444;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#000}
  .mod.on{border-color:rgba(0,255,136,.45)}
  .mod.on .ck{background:var(--green);border-color:var(--green)}
  .mod .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--text)}
  .mod .ic svg{width:20px;height:20px;fill:currentColor}
  .mod .ic img{width:20px;height:20px;border-radius:5px}
  .mod .ic.letter{font-size:10px;font-weight:700;background:#1c1c20;border-radius:6px}
  #usage{grid-template-columns:1fr 1fr}
  #usage .mod{padding:8px 10px}

  #foot{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 48px}
  #dots{display:flex;gap:6px}
  #dots i{width:6px;height:6px;border-radius:3px;background:#2a2a2e;transition:all .3s}
  #dots i.on{width:18px;background:var(--green)}
  #nav{display:flex;gap:8px}
  #back{border:0;background:transparent;color:var(--text2);padding:9px 14px;border-radius:10px}
  #back:hover{color:var(--text);background:#141416}
  #next{border:0;background:var(--green);color:#000;font-weight:600;padding:10px 22px;border-radius:10px;transition:transform .15s,opacity .15s}
  #next:hover{transform:translateY(-1px)}
  #next:disabled{opacity:.35;transform:none}
</style>
</head>
<body>
<div id="bar" data-tauri-drag-region><button id="close" title="Fermer" aria-label="Fermer">✕</button></div>
<div id="me" data-tauri-drag-region>
  <div id="ring"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="20" fill="none" stroke-width="4"/><circle class="fg" id="arc" cx="23" cy="23" r="20" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.7" stroke-dashoffset="125.7"/></svg><span>ر</span></div>
  <div class="who"><b>Rafiq</b><br><span id="whoSub"></span></div>
</div>
<div id="stage"></div>
<div id="foot"><div id="dots"></div><div id="nav"><button id="back"></button><button id="next"></button></div></div>

<script>
const T = window.__TAURI__;
const invoke = (cmd, args) => T && T.core ? T.core.invoke(cmd, args) : Promise.reject(new Error('no bridge'));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

// La langue de l'accueil (et de toute l'app) : choisie au premier écran, celle de Windows par défaut
let lang = 'fr';
const W = (fr, en) => lang === 'fr' ? fr : en;

const METHODS = [
  [3, 'Ligue islamique mondiale', 'Muslim World League'], [12, 'UOIF (France)', 'UOIF (France)'], [2, 'ISNA (Amérique du Nord)', 'ISNA (North America)'],
  [4, 'Umm al-Qura (La Mecque)', 'Umm al-Qura (Makkah)'], [5, 'Autorité égyptienne', 'Egyptian Authority'], [1, 'Karachi', 'Karachi'],
  [13, 'Diyanet (Turquie)', 'Diyanet (Turkey)'], [15, 'Moonsighting Committee', 'Moonsighting Committee'],
];
// Les modules proposés à la fin (la prière, les transports et Clippy ont leur propre question)
const EXTRAS = () => [
  ['meteo', W('Météo', 'Weather'), W('La température sous l’anneau, la pluie qui arrive, les 4 prochains jours.', 'The temperature under the ring, the rain on its way, the next 4 days.')],
  ['clipboard', W('Presse-papier', 'Clipboard'), W('Tes 30 derniers copiés, à un clic. Les mots de passe sont ignorés.', 'Your last 30 copies, one click away. Passwords are left out.')],
  ['asma', W('Un nom d’Allah par jour', 'A name of Allah each day'), W('Un des 99 noms, avec son sens.', 'One of the 99 names, with its meaning.')],
  ['screentime', W('Temps d’écran', 'Screen time'), W('Le temps passé dans chaque app aujourd’hui, gardé sur ce PC.', 'Time spent in each app today, kept on this PC.')],
];

// Où obtenir une clé chez chaque fournisseur de Clippy (src/ai.rs) ; open_link n'ouvre que ces pages
const KEY_PAGES = {
  deepseek:'https://platform.deepseek.com/api_keys',
  openai:'https://platform.openai.com/api-keys',
  gemini:'https://aistudio.google.com/apikey',
};

// Les IA dont le notch peut suivre l'usage (TRAY_PROVIDER_IDS dans main.rs)
const USAGE = [
  ['claude', 'Claude', 'Claude Code, Claude.ai'], ['codex', 'Codex', 'ChatGPT Codex'], ['gemini', 'Antigravity', 'Google'],
  ['cursor', 'Cursor', ''], ['grok', 'Grok', 'xAI'], ['glm', 'GLM', 'z.ai'],
];
let usage = { picked:new Set(), detected:new Set(), glyphs:{} };

let setup = null, modules = [], ai = null;
const ans = { prayer:true, transit:false, extras:{}, clippy:false };
// La clé tapée reste dans la page jusqu'à « C'est parti », puis part dans ai.json (ai_save) ; Rust ne la renvoie jamais
const clip = { provider:'deepseek', key:'', test:null, models:null };
let step = 0;
const first = () => (setup && setup.user_name || '').trim();
const cityText = c => c ? c.name + (c.country ? ' (' + c.country + ')' : '') : '';

/* ---- les écrans ---- */
const SCREENS = [
  { // 0 — la langue
    html: () => `<h1>Français ou English ?</h1>
      <p>${W('Choisis la langue de Rafiq. Tu pourras la changer dans les Settings → Apparence.', 'Choose Rafiq’s language. You can change it later in Settings → Appearance.')}</p>
      <div class="yesno" id="lang"><button data-v="fr" class="${lang === 'fr' ? 'on' : ''}">Français</button><button data-v="en" class="${lang === 'en' ? 'on' : ''}">English</button></div>`,
    mount: el => el.querySelector('#lang').addEventListener('click', e => {
      const b = e.target.closest('button[data-v]');
      if(!b || b.dataset.v === lang) return;
      lang = b.dataset.v;
      // Toute l'app passe dans cette langue tout de suite (menu, notch, Settings)
      invoke('set_lang', { lang }).catch(() => {});
      show();
    }),
    next: () => W('Suivant', 'Next'),
  },
  { // 1 — Rafiq se présente
    html: () => `<h1>${W('Salam ! Moi, c’est <em>Rafiq</em>.', 'Salam! I’m <em>Rafiq</em>.')}</h1>
      <p>${W('Rafiq, ça veut dire « compagnon ». Je vis sur le bord de ton écran, discret, et je t’aide au quotidien :', 'Rafiq means “companion”. I live on the edge of your screen, out of the way, and help you every day:')}</p>
      <div class="feats">
        <div><i>☾</i>${W('Les heures de prière, et un rappel avant la fin du temps', 'Prayer times, and a reminder before each one ends')}</div>
        <div><i>⇄</i>${W('Tes prochains trams, bus et trains', 'Your next trams, buses and trains')}</div>
        <div><i>°</i>${W('La météo de chez toi', 'The weather where you live')}</div>
        <div><i>⧉</i>${W('Tout ce que tu copies, gardé sous la main', 'Everything you copy, kept at hand')}</div>
        <div><i>✦</i>${W('Clippy, une IA pour réécrire tes textes', 'Clippy, an AI that rewrites your texts')}</div>
        <div><i>◔</i>${W('L’usage de tes IA (Claude, Codex…)', 'Your AI usage (Claude, Codex…)')}</div>
      </div>
      <p class="note">${W('Quelques questions et je suis prêt. Tout reste modifiable ensuite dans les Settings.', 'A few questions and I’m ready. Everything can be changed later in Settings.')}</p>`,
    next: () => W('Enchanté !', 'Nice to meet you!'),
  },
  { // 2 — le prénom
    html: () => `<h1>${W('Et toi, comment tu t’appelles ?', 'And you, what’s your name?')}</h1>
      <p>${W('Juste ton prénom, pour que je sache à qui je parle.', 'Just your first name, so I know who I’m talking to.')}</p>
      <input id="name" maxlength="40" placeholder="${W('Ton prénom', 'Your first name')}" autocomplete="off" value="${esc(first())}">`,
    mount: el => {
      const i = el.querySelector('#name');
      i.addEventListener('input', () => { setup.user_name = i.value.trim(); refreshNav(); });
      i.addEventListener('keydown', e => { if(e.key === 'Enter' && canNext()) go(1); });
      setTimeout(() => i.focus(), 120);
    },
    ok: () => first().length > 0,
  },
  { // 3 — la ville
    html: () => `<h1>${W('Enchanté, <em>' + esc(first()) + '</em> ! Tu habites où ?', 'Nice to meet you, <em>' + esc(first()) + '</em>! Where do you live?')}</h1>
      <p>${W('Ta ville me sert pour la météo et les heures de prière. Je garde seulement ses coordonnées, sur ce PC.', 'Your city is for the weather and the prayer times. I only keep its coordinates, on this PC.')}</p>
      <input id="city" placeholder="${W('Ta ville…', 'Your city…')}" autocomplete="off"><div class="sugg" id="citySugg"></div>
      <div class="chosen" id="cityNow">${setup.city ? W('C’est noté : ', 'Got it: ') + '<b>' + esc(cityText(setup.city)) + '</b>' : ''}</div>`,
    mount: el => {
      suggest(el.querySelector('#city'), el.querySelector('#citySugg'), searchCities, c => {
        setup.city = c;
        el.querySelector('#cityNow').innerHTML = W('C’est noté : ', 'Got it: ') + '<b>' + esc(cityText(c)) + '</b>';
        refreshNav();
      });
      setTimeout(() => el.querySelector('#city').focus(), 120);
    },
    next: () => setup.city ? W('Suivant', 'Next') : W('Passer', 'Skip'),
  },
  { // 4 — la prière
    html: () => `<h1>${W('Tu veux que je te rappelle les heures de prière ?', 'Shall I remind you of the prayer times?')}</h1>
      <p>${W('Un décompte jusqu’à la prochaine prière, une notification discrète à l’adhan, et une autre cinq minutes avant la fin du temps.', 'A countdown to the next prayer, a quiet notification at the adhan, and another five minutes before its time runs out.')}</p>
      <div class="yesno" id="pray"><button data-v="1" class="${ans.prayer ? 'on' : ''}">${W('Oui, volontiers', 'Yes, please')}</button><button data-v="0" class="${ans.prayer ? '' : 'on'}">${W('Non merci', 'No thanks')}</button></div>
      <div id="prayMore"></div>`,
    mount: el => {
      const more = () => {
        const box = el.querySelector('#prayMore');
        if(!ans.prayer){ box.innerHTML = ''; return; }
        if(setup.prayer_source === 'masjidbox'){
          box.innerHTML = '<p>' + W('Je lis les horaires de ta mosquée sur masjidbox.com. Tu peux passer aux horaires calculés dans les Settings → Profil.', 'I read your mosque’s times on masjidbox.com. You can switch to calculated times in Settings → Profile.') + '</p>';
          return;
        }
        box.innerHTML = '<p style="margin-bottom:6px">' + W('Je les calcule' + (setup.city ? ' pour ' + esc(setup.city.name) : '') + ' avec la méthode :', 'I calculate them' + (setup.city ? ' for ' + esc(setup.city.name) : '') + ' with the method:') + '</p>'
          + '<select id="method">' + METHODS.map(([v, fr, en]) => '<option value="' + v + '"' + (v === setup.prayer_method ? ' selected' : '') + '>' + esc(W(fr, en)) + '</option>').join('') + '</select>'
          + '<p class="note">' + W('Ta mosquée publie ses horaires sur masjidbox.com ? Tu pourras l’indiquer dans les Settings → Profil, avec l’iqama.', 'Does your mosque publish its times on masjidbox.com? You can set it in Settings → Profile, with the iqama.')
          + (setup.city ? '' : W(' Sans ville, je ne peux pas encore les calculer : reviens en arrière pour en choisir une.', ' Without a city I can’t calculate them yet: go back to pick one.')) + '</p>';
        box.querySelector('#method').addEventListener('change', e => { setup.prayer_method = Number(e.target.value); });
      };
      el.querySelector('#pray').addEventListener('click', e => {
        const b = e.target.closest('button[data-v]');
        if(!b) return;
        ans.prayer = b.dataset.v === '1';
        el.querySelectorAll('#pray button').forEach(x => x.classList.toggle('on', x === b));
        more();
      });
      more();
    },
  },
  { // 5 — les transports
    html: () => `<h1>${W('Tu prends les transports ?', 'Do you take public transport?')}</h1>
      <p>${W('Dis-moi tes arrêts : je te montre les prochains départs, retards compris.', 'Tell me your stops: I’ll show you the next departures, delays included.')}</p>
      <div class="yesno" id="tr"><button data-v="1" class="${ans.transit ? 'on' : ''}">${W('Oui', 'Yes')}</button><button data-v="0" class="${ans.transit ? '' : 'on'}">${W('Pas vraiment', 'Not really')}</button></div>
      <div id="trMore"></div>`,
    mount: el => {
      const more = () => {
        const box = el.querySelector('#trMore');
        if(!ans.transit){ box.innerHTML = ''; return; }
        box.innerHTML = '<input id="stop" placeholder="' + W('Un arrêt, une gare…', 'A stop, a station…') + '" autocomplete="off"><div class="sugg" id="stopSugg"></div><div class="stops" id="stops"></div>'
          + (setup.transit_source === 'opendata'
            ? '<p class="note">' + W('Horaires de transport.opendata.ch (Suisse).', 'Times from transport.opendata.ch (Switzerland).') + '</p>'
            : '<p class="note">' + W('Horaires', 'Times') + ' : <span class="lk" data-link="https://transitous.org/sources/">' + W('Transitous et ses sources', 'Transitous and its sources') + '</span> · <span class="lk" data-link="https://www.openstreetmap.org/copyright">© OpenStreetMap</span></p>');
        const draw = () => {
          box.querySelector('#stops').innerHTML = setup.transit_stops.map((s, i) =>
            '<div class="row"><span>' + esc(s.name) + (s.sub ? '<small style="color:#9a9aa0;margin-left:6px">' + esc(s.sub) + '</small>' : '') + '</span><button data-rm="' + i + '" aria-label="' + W('Retirer', 'Remove') + '">✕</button></div>').join('');
          box.querySelector('#stop').disabled = setup.transit_stops.length >= 4;
        };
        box.querySelector('#stops').addEventListener('click', e => {
          const b = e.target.closest('[data-rm]');
          if(b){ setup.transit_stops.splice(Number(b.dataset.rm), 1); draw(); }
        });
        suggest(box.querySelector('#stop'), box.querySelector('#stopSugg'), searchStops, s => {
          if(!setup.transit_stops.some(x => x.id === s.id)) setup.transit_stops.push(s);
          draw();
        });
        draw();
        setTimeout(() => box.querySelector('#stop').focus(), 120);
      };
      el.querySelector('#tr').addEventListener('click', e => {
        const b = e.target.closest('button[data-v]');
        if(!b) return;
        ans.transit = b.dataset.v === '1';
        el.querySelectorAll('#tr button').forEach(x => x.classList.toggle('on', x === b));
        more();
      });
      more();
    },
  },
  { // 6 — Clippy
    html: () => `<h1>${W('Tu veux un assistant pour réécrire tes textes ?', 'Would you like an assistant to rewrite your texts?')}</h1>
      <p>${W('Sélectionne un texte n’importe où, Ctrl+Alt+C : je le corrige, le traduis ou le reformule, et je le recolle à sa place.', 'Select some text anywhere, press Ctrl+Alt+C: I correct, translate or rephrase it, and paste it back.')} ${ai && ai.trial_available ? W('Tu as 5 essais offerts pour découvrir, ou mets ta propre clé d’API (souvent quelques centimes par mois).', 'You get 5 free tries to see how it works, or use your own API key (often a few cents a month).') : W('Il me faut une IA et ta propre clé d’API (souvent quelques centimes par mois).', 'I need an AI and your own API key (often a few cents a month).')}</p>
      <div class="yesno" id="cl"><button data-v="1" class="${ans.clippy ? 'on' : ''}">${W('Oui, je veux Clippy', 'Yes, I want Clippy')}</button><button data-v="0" class="${ans.clippy ? '' : 'on'}">${W('Plus tard', 'Later')}</button></div>
      <div id="clMore"></div>`,
    mount: el => {
      const keepNote = () => W('Ta clé reste sur ce PC.', 'Your key stays on this PC.');
      const more = () => {
        const box = el.querySelector('#clMore');
        if(!ans.clippy){ box.innerHTML = '<p class="note">' + W('Tu pourras l’activer quand tu veux : module Clippy, puis Réglages.', 'You can switch it on whenever you like: Clippy module, then Settings.') + '</p>'; return; }
        const pv = ai ? ai.providers.find(x => x.id === clip.provider) : null;
        const t = clip.test;
        box.innerHTML = '<p style="margin-bottom:6px">' + W('Quelle IA ?', 'Which AI?') + '</p>'
          + '<select id="clProv">' + (ai ? ai.providers : []).map(x => '<option value="' + esc(x.id) + '"' + (x.id === clip.provider ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>'
          + (ai && ai.trial_available && !(pv && pv.has_key) ? '<p class="note" style="margin:8px 0;color:var(--green)">' + W('Sans clé, tu as 5 essais offerts. Tu peux en mettre une maintenant ou plus tard.', 'Without a key you get 5 free tries. You can add one now or later.') + '</p>' : '')
          + '<p class="note" style="margin:8px 0">' + W('Pas encore de clé ? ', 'No key yet? ') + '<span class="lk" data-link="' + esc(KEY_PAGES[clip.provider] || '') + '">' + W('Crée-la chez ', 'Create one at ') + esc(pv ? pv.name : clip.provider) + '</span>' + W(', puis colle-la ici.', ', then paste it here.') + '</p>'
          + '<div style="display:flex;gap:8px"><input id="clKey" type="password" autocomplete="off" placeholder="' + (pv && pv.has_key && !clip.key ? W('Clé déjà enregistrée', 'Key already saved') : W('Ta clé d’API', 'Your API key')) + '" value="' + esc(clip.key) + '"><button class="mini" id="clTest">' + W('Tester', 'Test') + '</button></div>'
          + '<p class="note" id="clRes" style="color:' + (t ? (t.ok ? 'var(--green)' : '#FF8A70') : 'var(--text3)') + '">' + esc(t ? t.text : keepNote()) + '</p>';
        box.querySelector('#clProv').addEventListener('change', e => { clip.provider = e.target.value; clip.key = ''; clip.test = null; clip.models = null; more(); refreshNav(); });
        const key = box.querySelector('#clKey');
        key.addEventListener('input', () => { clip.key = key.value.trim(); clip.test = null; clip.models = null; box.querySelector('#clRes').textContent = keepNote(); box.querySelector('#clRes').style.color = 'var(--text3)'; });
        box.querySelector('#clTest').addEventListener('click', async () => {
          const res = box.querySelector('#clRes');
          res.style.color = 'var(--yellow)'; res.textContent = W('Je vérifie…', 'Checking…');
          try {
            const list = await invoke('ai_list_models', { provider:clip.provider, apiKey:clip.key || null });
            clip.models = list;
            const n = list.length;
            clip.test = { ok:true, text:W('Ça marche : ' + n + ' modèle' + (n > 1 ? 's' : '') + ' disponible' + (n > 1 ? 's' : '') + '.', 'It works: ' + n + ' model' + (n > 1 ? 's' : '') + ' available.') };
          } catch(e) {
            clip.test = { ok:false, text:W('Cette clé ne marche pas : ', 'This key doesn’t work: ') + (e && e.message || e) };
          }
          res.style.color = clip.test.ok ? 'var(--green)' : '#FF8A70';
          res.textContent = clip.test.text;
        });
        setTimeout(() => key.focus(), 120);
      };
      el.querySelector('#cl').addEventListener('click', e => {
        const b = e.target.closest('button[data-v]');
        if(!b) return;
        ans.clippy = b.dataset.v === '1';
        el.querySelectorAll('#cl button').forEach(x => x.classList.toggle('on', x === b));
        more();
      });
      more();
    },
  },
  { // 7 — les IA suivies
    html: () => `<h1>${W('Tu utilises quelles IA ?', 'Which AIs do you use?')}</h1>
      <p>${W('Je peux suivre ta consommation : ce qu’il te reste de ton forfait, et si Claude travaille encore. Coche celles que tu utilises', 'I can follow your usage: what’s left of your plan, and whether Claude is still working. Tick the ones you use')}${usage.detected.size ? W(' ; j’ai pré-coché celles que j’ai trouvées sur ce PC', '; I’ve ticked the ones I found on this PC') : ''}.</p>
      <div class="mods" id="usage">${USAGE.map(([id, name, sub]) => {
        const on = usage.picked.has(id), g = usage.glyphs[id];
        const icon = g && g.kind === 'svg' && g.svg ? '<span class="ic">' + g.svg + '</span>' : g && g.url ? '<span class="ic"><img src="' + esc(g.url) + '" alt=""></span>' : '<span class="ic letter">' + esc(name.slice(0, 2)) + '</span>';
        return '<button class="mod' + (on ? ' on' : '') + '" data-id="' + id + '">' + icon + '<span class="t"><b>' + esc(name) + '</b><span>' + esc(usage.detected.has(id) ? W('Trouvé sur ce PC', 'Found on this PC') : sub || ' ') + '</span></span><span class="ck">' + (on ? '✓' : '') + '</span></button>';
      }).join('')}</div>
      <p class="note">${W('Aucune ? Pas de souci, le notch n’affichera que tes modules.', 'None? No problem, the notch will only show your modules.')}</p>`,
    mount: el => el.querySelector('#usage').addEventListener('click', e => {
      const b = e.target.closest('.mod');
      if(!b) return;
      const id = b.dataset.id, on = !usage.picked.has(id);
      on ? usage.picked.add(id) : usage.picked.delete(id);
      b.classList.toggle('on', on);
      b.querySelector('.ck').textContent = on ? '✓' : '';
    }),
  },
  { // 8 — le reste
    html: () => `<h1>${W('Et qu’est-ce que tu veux voir d’autre ?', 'And what else would you like to see?')}</h1>
      <p>${W('Choisis ce qui t’est utile, tu pourras changer d’avis dans les Settings.', 'Pick what’s useful to you; you can change your mind in Settings.')}</p>
      <div class="mods" id="mods">${EXTRAS().map(([id, name, what]) =>
        '<button class="mod' + (ans.extras[id] ? ' on' : '') + '" data-id="' + id + '"><span class="t"><b>' + esc(name) + '</b><span>' + esc(what) + '</span></span><span class="ck">' + (ans.extras[id] ? '✓' : '') + '</span></button>').join('')}</div>`,
    mount: el => el.querySelector('#mods').addEventListener('click', e => {
      const b = e.target.closest('.mod');
      if(!b) return;
      const on = !ans.extras[b.dataset.id];
      ans.extras[b.dataset.id] = on;
      b.classList.toggle('on', on);
      b.querySelector('.ck').textContent = on ? '✓' : '';
    }),
  },
  { // 9 — c'est parti
    html: () => `<h1>${W('C’est parti, <em>' + esc(first()) + '</em> !', 'Let’s go, <em>' + esc(first()) + '</em>!')}</h1>
      <p>${W('Je suis sur le bord droit de ton écran. Passe la souris sur moi pour tout voir, clique sur un anneau pour le rafraîchir.', 'I’m on the right-hand edge of your screen. Hover over me to see everything, click a ring to refresh it.')}</p>
      <p>${W('Clic droit sur le notch pour les Settings : ton profil, tes modules, leur ordre… tout se change là-bas.', 'Right-click the notch for Settings: your profile, your modules, their order… everything can be changed there.')}</p>
      <p class="note">${esc(recap())}</p>`,
    next: () => W('C’est parti', 'Let’s go'),
  },
];

function recap(){
  const bits = [];
  if(setup.city) bits.push(setup.city.name);
  if(ans.prayer) bits.push(W('prière', 'prayer'));
  const n = setup.transit_stops.length;
  if(ans.transit && n) bits.push(n + W(' arrêt' + (n > 1 ? 's' : ''), ' stop' + (n > 1 ? 's' : '')));
  EXTRAS().forEach(([id, name]) => { if(ans.extras[id]) bits.push(name.toLowerCase()); });
  if(clippyOn()) bits.push('Clippy');
  USAGE.forEach(([id, name]) => { if(usage.picked.has(id)) bits.push(name); });
  return bits.length ? W('Au programme : ', 'Coming up: ') + bits.join(' · ') + '.' : '';
}

/* ---- navigation ---- */
const stage = document.getElementById('stage');
let current = null;
function canNext(){ const s = SCREENS[step]; return !s.ok || s.ok(); }
function refreshNav(){
  const s = SCREENS[step], next = document.getElementById('next');
  next.textContent = typeof s.next === 'function' ? s.next() : (s.next || W('Suivant', 'Next'));
  next.disabled = !canNext();
  const back = document.getElementById('back');
  back.textContent = W('Retour', 'Back');
  back.hidden = step === 0;
  document.getElementById('close').title = W('Fermer', 'Close');
  document.documentElement.lang = lang;
  document.getElementById('dots').innerHTML = SCREENS.map((_, i) => '<i' + (i === step ? ' class="on"' : '') + '></i>').join('');
  // L'anneau se remplit au fil des questions
  document.getElementById('arc').style.strokeDashoffset = String(125.7 * (1 - step / (SCREENS.length - 1)));
  document.getElementById('whoSub').textContent = first() ? W('le compagnon de ' + first(), first() + '’s companion') : W('ton compagnon', 'your companion');
}
function show(){
  const el = document.createElement('div');
  el.className = 'screen enter';
  el.innerHTML = SCREENS[step].html();
  if(current){ const old = current; old.className = 'screen leave'; setTimeout(() => old.remove(), 260); }
  stage.appendChild(el);
  current = el;
  if(SCREENS[step].mount) SCREENS[step].mount(el);
  refreshNav();
}
function go(by){
  if(by > 0 && !canNext()) return;
  if(by > 0 && step === SCREENS.length - 1){ finish(); return; }
  step = Math.max(0, Math.min(SCREENS.length - 1, step + by));
  show();
}
document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('back').addEventListener('click', () => go(-1));
document.getElementById('close').addEventListener('click', closeMe);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMe(); });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-link]');
  if(a) invoke('open_link', { url:a.dataset.link }).catch(() => {});
});
function closeMe(){
  try { T.window.getCurrentWindow().close(); } catch(e) { /* rien à fermer hors de l'app */ }
}

/* Tout est écrit ici, d'un coup : le profil, puis les modules (l'ordre déjà choisi est gardé) */
function clippyOn(){
  const pv = ai && ai.providers.find(x => x.id === clip.provider);
  return ans.clippy && (!!clip.key || !!(pv && pv.has_key) || !!(ai && ai.trial_available));
}
async function finish(){
  const next = document.getElementById('next');
  next.disabled = true;
  const on = { prayer:ans.prayer, tpg:ans.transit && setup.transit_stops.length > 0, ...ans.extras, clippy:clippyOn() };
  const order = modules.length ? modules.map(m => m.id) : ['prayer', 'tpg', 'meteo', 'clipboard', 'screentime', 'asma', 'clippy'];
  for(const id of Object.keys(on)) if(!order.includes(id)) order.push(id);
  try {
    await invoke('set_setup', { setup:{ ...setup, prayer_notify:ans.prayer, onboarded:true } });
    if(ans.clippy && ai && (clip.key || clip.provider !== ai.provider)){
      const pv = ai.providers.find(x => x.id === clip.provider);
      // Le modèle par défaut du fournisseur, sauf si le test a montré qu'il n'est plus servi
      let model = pv ? pv.model : '';
      if(clip.models && clip.models.length && !clip.models.includes(model)) model = clip.models[0];
      await invoke('ai_save', { s:{ provider:clip.provider, model, api_key:clip.key || null, hotkey:ai.hotkey, auto_paste:ai.auto_paste } });
    }
    await invoke('set_notch_modules', { modules:order.map(id => ({ id, on:!!on[id] })) });
    // Les IA suivies : seulement celles cochées ; aucune = « none » (le notch ne montre que les modules)
    const slots = USAGE.map(([id]) => id).filter(id => usage.picked.has(id)).map(provider => ({ provider }));
    await invoke('set_notch_slots', { slots:slots.length ? slots : [{ provider:'none' }] });
  } catch(e) {
    next.disabled = false;
    next.textContent = W('Réessayer', 'Try again');
    return;
  }
  closeMe();
}

/* ---- recherches (les mêmes que les Settings → Profil) ---- */
function suggest(input, list, search, pick){
  let timer = 0, seq = 0;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if(q.length < 2){ list.innerHTML = ''; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      let items;
      try { items = await search(q); } catch(e) { list.innerHTML = '<p class="note">' + W('Recherche impossible : ', 'Search failed: ') + esc(e && e.message || e) + '</p>'; return; }
      if(mine !== seq) return;
      list.innerHTML = items.length ? '' : '<p class="note">' + W('Je ne trouve rien, essaie autrement.', 'Nothing found, try something else.') + '</p>';
      items.forEach(it => {
        const b = document.createElement('button');
        b.innerHTML = esc(it.label) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '');
        b.addEventListener('mousedown', ev => { ev.preventDefault(); list.innerHTML = ''; input.value = ''; pick(it.value); });
        list.appendChild(b);
      });
    }, 300);
  });
}
async function searchCities(q){
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&format=json&language=' + lang + '&name=' + encodeURIComponent(q));
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return (j.results || []).map(c => ({
    label:c.name, sub:[c.admin1, c.country].filter(Boolean).join(', '),
    value:{ name:c.name, region:c.admin1 || '', country:c.country || '', lat:c.latitude, lon:c.longitude, timezone:c.timezone || '' },
  }));
}
async function searchStops(q){
  if(setup.transit_source === 'opendata'){
    const r = await fetch('https://transport.opendata.ch/v1/locations?type=station&query=' + encodeURIComponent(q));
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return (j.stations || []).filter(s => s.id).slice(0, 8).map(s => ({ label:s.name, sub:'', value:{ id:String(s.id), name:s.name, sub:'' } }));
  }
  const stops = await invoke('transit_search', { text:q });
  return (stops || []).map(s => ({ label:s.name, sub:s.sub, value:s }));
}

/* ---- départ : on repart de ce qui est déjà réglé (« Revoir l'accueil » ne perd rien) ---- */
Promise.all([invoke('get_setup'), invoke('get_notch_modules').catch(() => []), invoke('ai_get').catch(() => null),
  invoke('get_tray_options').catch(() => []), invoke('get_notch_slots').catch(() => []), invoke('get_glyphs').catch(() => ({})),
  invoke('get_lang_resolved').catch(() => '')]).then(([s, m, a, opts, slots, glyphs, resolved]) => {
  // La langue de départ : celle déjà réglée, sinon celle de Windows (fr ou en)
  lang = String(resolved || navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en';
  // Trouvées sur ce PC : celles qui ne sont pas « absentes » ; déjà réglé (Revoir l'accueil) : le choix actuel
  usage.glyphs = glyphs || {};
  (Array.isArray(opts) ? opts : []).forEach(o => { if(o && o.status && o.status !== 'absent') usage.detected.add(o.id); });
  const chosen = (Array.isArray(slots) ? slots : []).map(x => x && x.provider);
  if(s && s.onboarded) (chosen.length ? chosen.filter(id => id !== 'none') : [...usage.detected]).forEach(id => usage.picked.add(id));
  else usage.detected.forEach(id => usage.picked.add(id));
  ai = a;
  if(ai) clip.provider = ai.provider;
  setup = s;
  setup.transit_stops = Array.isArray(setup.transit_stops) ? setup.transit_stops : [];
  modules = Array.isArray(m) ? m : [];
  const isOn = id => { const x = modules.find(y => y.id === id); return x ? x.on !== false : !modules.length; };
  ans.prayer = setup.onboarded ? isOn('prayer') && setup.prayer_notify !== false : true;
  ans.transit = setup.transit_stops.length > 0;
  EXTRAS().forEach(([id]) => { ans.extras[id] = setup.onboarded ? isOn(id) : id === 'meteo' || id === 'clipboard'; });
  const pv = ai && ai.providers.find(x => x.id === clip.provider);
  ans.clippy = setup.onboarded ? isOn('clippy') && !!(pv && pv.has_key) : false;
  show();
}).catch(() => {
  lang = String(navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en';
  setup = { user_name:'', city:null, prayer_source:'aladhan', prayer_method:3, prayer_masjid:'', prayer_notify:true, transit_source:'transitous', transit_stops:[], onboarded:false };
  show();
});
</script>
